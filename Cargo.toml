[package]
# `ccsync` is taken on crates.io by an unrelated project; the package is
# published as `claude-sync`, but the installed command stays `ccsync` (the
# daemon's process identity check relies on that name).
name = "claude-sync"
version = "0.1.0"
edition = "2021"
description = "Sync and back up Claude Code settings, sessions, and memory across machines"
license = "MIT"
repository = "https://github.com/aoprisan/ccsync"
homepage = "https://github.com/aoprisan/ccsync"
readme = "README.md"
keywords = ["claude", "claude-code", "sync", "backup", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "CLAUDE.md", "install.sh"]

[[bin]]
name = "ccsync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"
flate2 = "1"
age = { version = "0.10", features = ["armor"] }
sha2 = "0.10"
walkdir = "2"
dirs = "5"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
thiserror = "1"
tempfile = "3"
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
